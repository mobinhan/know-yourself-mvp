name: Ephemeris cross-engine audit

on:
  push:
    branches:
      - "audit/**"
    paths:
      - "audit/astronomy-engine/**"
      - ".github/workflows/ephemeris-cross-audit.yml"
  pull_request:
    paths:
      - "audit/astronomy-engine/**"
      - ".github/workflows/ephemeris-cross-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-engine-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent reference engine
        run: python -m pip install pyswisseph==2.10.3.2
      - name: Download official Astronomy Engine standalone source
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/cosinekitty/astronomy/master/source/js/astronomy.js --output audit/astronomy-engine/astronomy.js
      - name: Run cross-engine comparison
        working-directory: audit/astronomy-engine
        run: python compare.py dates.json
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeris-cross-engine-audit
          path: audit/astronomy-engine/comparison-results.json
          if-no-files-found: warn
