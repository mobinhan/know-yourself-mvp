name: Step 1 Engine Validation

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/step1-engine.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r engine/requirements.txt pytest
      - name: Run ephemeris tests
        run: python -m pytest -q engine/test_golden.py engine/test_multi_chart.py engine/test_boundaries.py engine/test_timezone.py engine/test_design.py

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic structural test
        run: node engine/test_structural.mjs
      - name: Run evidence layer test
        run: node engine/test_evidence.mjs
