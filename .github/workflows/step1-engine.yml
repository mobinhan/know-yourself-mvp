name: Step 1 Engine Validation

run-name: "Know Yourself — Engine Validation — ${{ github.event_name }}"

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/step1-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python engine validation
    runs-on: ubuntu-latest
    steps:
      - name: Workflow heartbeat
        run: |
          echo "WORKFLOW_STARTED"
          echo "Run ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r engine/requirements.txt pytest
      - name: Run ephemeris tests
        run: |
          set -o pipefail
          python -m pytest -q \
            engine/test_golden.py \
            engine/test_multi_chart.py \
            engine/test_boundaries.py \
            engine/test_timezone.py \
            engine/test_design.py \
            engine/test_substructure.py \
            engine/test_temporal_ephemeris.py \
            engine/test_temporal_edge_mechanics.py \
            engine/test_temporal_golden.py 2>&1 | tee python-validation.txt
      - name: Publish Python validation result
        if: always()
        run: |
          echo "## Python engine validation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f python-validation.txt ]; then
            cat python-validation.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Python test process did not produce output." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Python validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-validation-${{ github.run_id }}
          path: python-validation.txt
          if-no-files-found: warn

  javascript-tests:
    name: JavaScript contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Workflow heartbeat
        run: |
          echo "WORKFLOW_STARTED"
          echo "Run ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic structural test
        run: node engine/test_structural.mjs
      - name: Run evidence layer test
        run: node engine/test_evidence.mjs
      - name: Run mechanical edge-case tests
        run: node engine/test_mechanics.mjs
      - name: Run transit overlay mechanics test
        run: node engine/test_transit_overlay.mjs
      - name: Run time and life-cycle mechanics test
        run: node engine/test_time_mechanics.mjs
      - name: Run connection mechanics test
        run: node engine/test_connection_mechanics.mjs
      - name: Run temporal state integration test
        run: node engine/test_temporal_state.mjs
      - name: Run connection invariants test
        run: node engine/test_connection_invariants.mjs
      - name: Run transit invariants test
        run: node engine/test_transit_invariants.mjs
      - name: Validate chart contract
        run: node engine/validate_contract.mjs
      - name: Validate canonical chart artifact
        run: node engine/test_canonical_chart.mjs
      - name: Validate canonical downstream data contracts
        run: node engine/validate_data_contracts.mjs
      - name: Run canonical downstream contract integration test
        run: node engine/test_data_contracts.mjs
      - name: Validate controlled knowledge sources
        run: node engine/validate_knowledge.mjs
      - name: Run controlled knowledge layer test
        run: node engine/test_knowledge.mjs
      - name: Validate AI reasoning contract
        run: node engine/validate_ai_reasoning.mjs
      - name: Run AI reasoning contract test
        run: node engine/test_ai_reasoning_contract.mjs
      - name: Run evidence-to-knowledge retrieval test
        run: node engine/test_knowledge_retrieval.mjs
      - name: Write JavaScript validation marker
        if: always()
        run: |
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "javascript_validation_completed=true"
            date -u
          } > javascript-validation.txt
      - name: Publish JavaScript validation result
        if: always()
        run: |
          echo "## JavaScript contract validation" >> "$GITHUB_STEP_SUMMARY"
          cat javascript-validation.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JavaScript validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-validation-${{ github.run_id }}
          path: javascript-validation.txt
          if-no-files-found: warn
