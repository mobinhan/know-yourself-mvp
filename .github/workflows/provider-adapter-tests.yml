name: AI provider adapter tests

on:
  pull_request:
    paths:
      - "api/interpretation_provider.py"
      - "tests/test_provider_adapters.py"
      - ".github/workflows/provider-adapter-tests.yml"
  push:
    branches:
      - "feature/provider-comparison-harness"

jobs:
  provider-adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider adapter contract tests
        run: python -m unittest tests.test_provider_adapters -v
