function bodygraph(){const defined=new Set(state.chart?.core?.centres||[]);const channels=(state.chart?.core?.channels||[]).map(x=>x.channel);let lines='';for(const ch of channels){const cs=channelCentres[ch];if(!cs)continue;const a=centrePos[cs[0]],b=centrePos[cs[1]];lines+=`<button class="bg-channel-hit" onclick="openChannel('${ch}')" aria-label="Explore channel ${ch}"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="channel"/><text x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2-4}" class="channel-label">${ch}</text></button>`}let centers='';for(const [k,[x,y]] of Object.entries(centrePos)){const active=defined.has(k);centers+=`<g class="centre ${active?'defined':'open'}" onclick="openCentre('${k}')" tabindex="0" role="button" aria-label="Explore ${centreLabels[k]} centre"><circle cx="${x}" cy="${y}" r="24"/><text x="${x}" y="${y+4}" text-anchor="middle">${centreLabels[k]}</text></g>`}return `<svg viewBox="0 0 320 430" role="img" aria-label="Your Human Design BodyGraph"><g class="bg-lines">${lines}</g>${centers}</svg>`}

function interpretationCards(c){return (c.interpretations||[]).map(x=>`<article class="insight-card"><div class="insight-meta"><span class="label">${esc(x.concept)}</span><span class="evidence-badge">Source-backed</span></div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="insight-observe"><b>Notice</b><span>${esc(x.observe)}</span></div><button class="text-action" onclick="go('ask')">Explore this with Know Yourself →</button></article>`).join('')}
function chartFoundation(c){const type=(c.type||'').replaceAll('_',' '),authority=(c.authority||'').replaceAll('_',' '),strategy=(c.strategy||'').replaceAll('_',' ');return `${chartTabs()}<div class="personal-card"><div class="personal-kicker">Your starting point</div><h2>${esc(type)}</h2><p>Your chart points to <strong>${esc(authority)}</strong> as your Authority, with a <strong>${esc(c.profile)}</strong> Profile. You don’t need to memorise any of that yet. We can discover what it means together.</p><button class="soft-action" onclick="go('ask')">Tell me more about me <span>→</span></button></div><div class="card bodygraph"><div class="graph-heading"><div><span class="label">Your BodyGraph</span><h3>A map of what is consistent in you.</h3></div><div class="legend"><span><i class="dot defined-dot"></i>Defined</span><span><i class="dot open-dot"></i>Open</span></div></div>${bodygraph()}<p class="graph-caption">Click a centre or channel when something catches your attention.</p></div><div class="grid">${[['Type',type],['Strategy',strategy],['Authority',authority],['Profile',c.profile],['Definition',c.definition?.type||c.definition],['Channels',(c.channels||[]).length+' defined']].map(([a,b])=>`<div class="metric"><span class="label">${a}</span><b>${esc(b)}</b><small>${a==='Authority'?'The decision-making voice your design gives you.':a==='Strategy'?'A way of moving with life rather than forcing it.':a==='Profile'?'The way your life role tends to be expressed.':'A first piece of the picture.'}</small></div>`).join('')}</div><div class="interpretation-section"><div class="section-intro compact"><span class="label">A first reading</span><h2>Start with what feels familiar.</h2><p>These are not labels to live up to. They are source-backed starting points for noticing your own experience.</p></div><div class="insight-grid">${interpretationCards(c)}</div></div><div class="card channel-card"><div><span class="label">Already curious?</span><h3>These are the themes your chart carries consistently.</h3></div><div>${(c.channels||[]).map(x=>`<button class="pill action" onclick="openChannel('${x.channel}')">${esc(x.channel)}</button>`).join(' ')||'None'}</div><button class="text-action" onclick="go('explore')">Explore one of them →</button></div>`}
function chartCharacteristics(c){const phs=state.chart?.phs||{};const cross=c.incarnation_cross||{};return `${chartTabs()}<div class="section-intro"><span class="label">How your design operates</span><h2>There is more here than the headline.</h2><p>These are structural characteristics calculated from your chart. We keep the mechanics separate from interpretation so you can explore them without turning them into fixed labels.</p></div><div class="grid"><div class="metric"><span class="label">Definition</span><b>${esc(c.definition?.type||'')}</b><small>${esc((c.definition?.components||[]).map(x=>x.join(' + ')).join(' · '))}</small></div><div class="metric"><span class="label">Incarnation Cross</span><b>Four primary placements</b><small>${Object.entries(cross).map(([k,v])=>`${k.replaceAll('_',' ')}: ${v.gate}.${v.line}`).join(' · ')}</small></div><div class="metric"><span class="label">PHS · Determination</span><b>${esc(phs.determination?.name||'Available')}</b><small>${esc(phs.determination?.orientation||'')}</small></div><div class="metric"><span class="label">PHS · Environment</span><b>${esc(phs.environment?.name||'Available')}</b><small>${esc(phs.environment?.subtype||'')}</small></div></div><div class="card"><span class="label">Your six defined channels</span><div class="channel-stack">${(c.channels||[]).map(x=>`<button class="list-row" onclick="openChannel('${x.channel}')"><strong>${esc(x.channel)}</strong><span>${x.gates.join(' · ')} · ${x.centres.map(y=>centreLabels[y]).join(' / ')}</span><span>→</span></button>`).join('')}</div></div><div class="interpretation-section"><div class="section-intro compact"><span class="label">What this can become</span><h2>Your chart is a conversation, not a verdict.</h2><p>We will keep expanding the reading as verified source material is loaded. Know Yourself will always distinguish chart mechanics, source teaching and reflective synthesis.</p></div><div class="notice-card"><strong>Evidence boundary</strong><p>The interpretation function chartCurrent(c){return `${chartTabs()}<div class="section-intro"><span class="label">Current Experience</span><h2>What is happening around your design?</h2><p>Your natal design remains the steady ground. Temporary activations belong here — separate from what is consistently defined in you.</p></div><div class="current-card"><div><span class="personal-kicker">Today</span><h3>See what is meeting your design.</h3><p>Open Today to calculate a specific moment and see active gates, temporary channels and temporarily defined centres.</p></div><button class="primary" onclick="go('today')">Open Today →</button></div><div class="card"><div class="graph-heading"><div><span class="label">Natal baseline</span><h3>What does not move with today's weather.</h3></div></div><div class="baseline-grid"><div><b>${esc((c.channels||[]).length)}</b><span>defined channels</span></div><div><b>${esc((c.centres||[]).length)}</b><span>defined centres</span></div><div><b>${esc(c.definition?.type||'')}</b><span>definition</span></div></div><p class="quiet">When a transit adds something temporarily, we will show it as temporary rather than changing this baseline.</p></div>`}

nput type="hidden" id="birthLongitude" name="longitude"><div id="birthResolved" class="resolved-place" hidden></div><button class="primary" id="birthSubmit" disabled>Meet My Chart <span>→</span></button></form><p class="quiet">Your birth data calculates the mechanics. The meaning comes afterwards — through evidence, context and conversation.</p></div><div class="mvp-note"><span>Built for the first conversation.</span><b>My Chart · Today · Explore · Ask · Library</b><p>We are deliberately keeping the MVP simple. The depth can grow behind it.</p></div></section>`;

function chartLocalNow(){
  const tz=state.chart?.core?.timezone||state.chart?.birth_data?.timezone||'UTC';
  const d=new Date();
  try{
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
    const o=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    return `${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`;
  }catch{return d.toISOString().slice(0,16)}
}

    const gateIsNatal=!!d.gate && activationGates.has(d.gate);
    const isGate34=d.gate===34;
    const personal = d.centre ? `<div class="personal-relevance"><span class="evidence-kind">${(core.centres||[]).includes(d.centre)?'Defined in your design':'Open in your design'}</span><p>${(core.centres||[]).includes(d.centre)?`Your ${esc(d.title)} Centre is consistently defined in your natal BodyGraph.`:`Your ${esc(d.title)} Centre is not consistently defined in your natal BodyGraph. That is a chart fact — it is not a personality label.`}</p>${connectedNatalChannels.length?`<p class="reflection">In your chart, this centre is connected through <strong>${connectedNatalChannels.map(x=>esc(x.channel)).join(' · ')}</strong>. Click one to see the relationship.</p>`:`<p class="reflection">There is no natal channel connecting this centre in your current chart. We can explore what the source material says without turning an open centre into a fixed description of you.</p>`}</div>`
      : d.channel ? `<div class="personal-relevance"><span class="evidence-kind">${channelIsNatal?'Defined in your design':'Not defined in your natal design'}</span><p>${channelIsNatal?`Channel <strong>${esc(d.channel)}</strong> is one of the six channels defined in your natal BodyGraph. Its two centres are ${esc((d.centres||[]).map(c=>centreLabels[c]||c).join(' and '))}.`:`Channel <strong>${esc(d.channel)}</strong> is not part of your natal definition. You can explore its mechanics, but Know Yourself will not present its general description as a claim about you.`}</p></div>`
      : d.gate ? `<div class="personal-relevance"><span class="evidence-kind">${gateIsNatal?'Present in your natal activations':'Not present in your natal activations'}</span><p>${gateIsNatal?`Gate ${d.gate} appears in your natal activations. That makes it a real part of the chart we are exploring together.`:`Gate ${d.gate} is not one of the gates in your natal activations. You can still explore it, but we keep the general teaching separate from your personal chart.`}</p></div>` : '';
    const teaching=isGate34 && d.teaching ? `<div class="source-section"><div class="section-kicker">What the source is pointing to</div><p>${esc(d.teaching)}</p><div class="keynote">“${esc(d.keynote)}”</div></div>` : '';
    const lines=isGate34 && d.lines ? `<div class="source-section"><div class="section-kicker">The six line expressions</div><div class="line-grid">${d.lines.map(x=>`<div class="line-card"><span>Line ${x.line}</span><strong>${esc(x.title)}</strong><p>${esc(x.theme)}</p></div>`).join('')}</div></div>` : '';
    const channels=isGate34 && d.channel_teachings ? `<div class="relationship-box"><span class="label">Where Gate 34 connects</span><div class="channel-teachings">${Object.entries(d.channel_teachings).map(([ch,label])=>`<button class="channel-teaching" onclick="openChannel('${ch}')"><strong>${ch}</strong><span>${esc(label)}</span></button>`).join('')}</div></div>` : '';
    detail=`<div class="card detail warm-detail"><div class="eyebrow">Let’s look closer</div><h2>${esc(d.title)}</h2><p class="detail-lead">${isGate34?'This is where the knowledge layer starts to feel less like a textbook and more like a conversation about something that may matter to you.':'Here’s the part we can establish from your chart structure and the source material. We can then make it personal through conversation.'}</p>${personal}${teaching}${lines}${channels}<div class="evidence-card"><span class="evidence-kind">Evidence</span><p>${esc(d.note||'The source-backed material is available for this concept.')}</p>${d.source_page?`<small>Complete Rave I’Ching · source page ${esc(d.source_page)}</small>`:''}</div><div class="source-row">${(d.source_ids||[d.source_id]).filter(Boolean).map(x=>`<span class="source">${esc(x)}</span>`).join('')}</div>${d.channels?`<div class="relationship-box"><span class="label">Connected channels</span><p>${d.channels.map(x=>`<button class="pill action" onclick="openChannel('${x}')">${x}</button>`).join(' ')||'None yet'}</p></div>`:''}${d.gates?`<div class="relationship-box"><span class="label">Gates in this channel</span><p>${d.gates.join(' · ')}</p></div>`:''}${d.centres?`<div class="relationship-box"><span class="label">Centres involved</span><p>${d.centres.map(c=>centreLabels[c]||c).join(' · ')}</p></div>`:''}<div class="detail-actions"><button class="primary" onclick="askAboutCurrent()">Ask me about this →</button><button class="secondary" onclick="go('ask')">Ask something else</button></div></div>`;
  }
  return `<section class="screen"><div class="hero hero-warm"><div class="eyebrow">Explore</div><h1>Follow what makes you <em>curious.</em></h1><p>You don’t have to learn Human Design from the top down. Start anywhere. A gate that keeps appearing. A centre you don’t understand. A channel that feels strangely familiar.</p></div>${journeyStrip('explore')}<div class="explore-invite"><span>✦</span><div><strong>There is no right order.</strong><p>Explore a little. Notice what resonates. Then ask about it.</p></div></div><div class="segmented"><button class="${k==='gate'?'selected':''}" onclick="setExplore('gate')">Gates</button><button class="${k==='channel'?'selected':''}" onclick="setExplore('channel')">Channels</button><button class="${k==='centre'?'selected':''}" onclick="setExplore('centre')">Centres</button></div>${search}<div class="explore-list">${list}</div>${detail}</section>`;
}
function askAboutCurrent(){
  const d=state.explore.detail;
  if(!d){go('ask');return;}
  const subject=d.gate?`Gate ${d.gate}`:d.channel?`Channel ${d.channel}`:d.title;
  state.view='ask';
  state.chat.push({role:'user',text:`Help me understand ${subject} in my own design.`});
  render();
  sendAsk();
}

function renderAsk(){const c=state.chart?.core||{};const chips=state.chart?[`What does my ${String(c.authority||'Authority').replaceAll('_',' ')} mean?`,`Why do I have these channels?`,`What should I pay attention to in my design?`,`Help me understand my chart in simple terms`]:[`What is Human Design?`,`How does a chart help me understand myself?`];return `<section class="screen ask-screen"><div class="hero hero-warm"><div class="eyebrow">Ask · Your conversation</div><h1>Bring me a real question.</h1><p>You don’t need the right words. Tell me what you are wondering about, and we’ll connect it to your design without turning you into a list of definitions.</p></div>${journeyStrip('ask')}${!state.chat.length?`<div class="ask-welcome"><div class="avatar">✦</div><div><strong>Where would you like to begin?</strong><p>Try one of these, or ask something completely different.</p></div></div><div class="suggestions">${chips.map(x=>`<button onclick="askSuggestion('${esc(x).replace(/'/g,"&#39;")}')">${esc(x)} <span>→</span></button>`).join('')}</div>`:''}<div class="chat">${state.chat.map(m=>`<div class="bubble ${m.role}">${m.role==='ai'?'<div class="bubble-label">Know Yourself</div>':''}${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div>${state.chat.length?`<div class="save-row"><button class="soft-action" onclick="saveConversation()">Save this conversation ↗</button></div>`:''}<div class="askbar"><input id="askInput" placeholder="What are you noticing, wondering or deciding?"/><button class="primary" id="sendAsk">Ask →</button></div></section>`}
function renderLibrary(){
  const insights=library.insights||[], snapshots=library.snapshots||[], conversations=library.conversations||[];
  const fmt=x=>x?new Date(x).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';
  const insightList=insights.length?insights.map(x=>`<article class="library-item"><div><span class="label">Saved insight · ${esc(fmt(x.created_at))}</span><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="insight-observe"><b>Notice</b><span>${esc(x.reflection||'')}</span></div></div><button class="text-action danger" onclick="deleteLibraryItem('insights','${x.id}')">Remove</button></article>`).join(''):'<div class="empty-state"><strong>Nothing saved yet.</strong><p>When something in Today feels worth returning to, save it here.</p></div>';
  const snapshotList=snapshots.length?snapshots.map(x=>`<article class="library-item"><div><span class="label">Saved moment · ${esc(fmt(x.timestamp_utc))}</span><h3>${esc(x.title)}</h3><p>${esc(x.one_line)}</p><small>${esc((x.transit?.transit_gates||[]).length)} active transit gates · ${esc((x.transit?.temporary_channels||[]).length)} temporary channels</small></div><button class="text-action danger" onclick="deleteLibraryItem('snapshots','${x.id}')">Remove</button></article>`).join(''):'<div class="empty-state"><strong>No moments saved yet.</strong><p>Save a Today moment to preserve the exact transit context that created it.</p></div>';
  const conversationList=conversations.length?conversations.map(x=>`<article class="library-item"><div><span class="label">Conversation · ${esc(fmt(x.created_at))}</span><h3>${esc(x.title)}</h3><p>${esc((x.messages||[]).length)} messages saved.</p></div><button class="text-action danger" onclick="deleteLibraryItem('conversations','${x.id}')">Remove</button></article>`).join(''):'<div class="empty-state"><strong>Your conversations can become part of your journey.</strong><p>Ask something meaningful, then save the conversation when you want to keep it.</p></div>';
  return `<section class="screen library-screen"><div class="hero hero-warm"><div class="eyebrow">Library</div><h1>Keep what becomes meaningful.</h1><p>Your Library is where moments stop disappearing. My Chart remains your primary identity; saved insights, transit moments and conversations become the trail of what you are discovering.</p></div>${journeyStrip('library')}<div class="library-primary card"><div><span class="personal-kicker">My Chart · Primary</span><h2>${state.chart?'Your design is here.':'Your chart is waiting.'}</h2><p>${state.chart?'The Library does not replace My Chart. It gives the things you discover around it somewhere to live.':'Create My Chart first, then your Library can begin to collect meaningful moments.'}</p></div><button class="primary" onclick="go('chart')">${state.chart?'Open My Chart →':'Meet My Chart →'}</button></div><div class="library-section"><div class="section-intro compact"><span class="label">Saved insights · ${insights.length}</span><h2>Things worth remembering.</h2><p>Source context and your reflection stay together.</p></div><div class="library-stack">${insightList}</div></div><div class="library-section"><div class="section-intro compact"><span class="label">Transit moments · ${snapshots.length}</span><h2>Moments in time.</h2><p>A saved moment keeps the exact transit state rather than only a generic note.</p></div><div class="library-stack">${snapshotList}</div></div><div class="library-section"><div class="section-intro compact"><span class="label">Conversations · ${conversations.length}</span><h2>Questions you have lived with.</h2><p>Conversation history is kept separate from chart mechanics and evidence.</p></div><div class="library-stack">${conversationList}</div></div><div class="grid library-future"><div class="card"><b>Chart Library</b><p class="notice">Additional charts will live here without replacing My Chart.</p></div><div class="card"><b>Compare</b><p class="notice">Two-chart comparison will use the same deterministic engine.</p></div><div class="card"><b>Relationships</b><p class="notice">Connection analysis will build on the comparison layer.</p></div><div class="card"><b>Journey</b><p class="notice">Life cycles and saved milestones will build on this history.</p></div></div></section>`}
function render(){app.innerHTML={chart:renderChart,today:renderToday,explore:renderExplore,ask:renderAsk,library:renderLibrary}[state.view]();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===state.view));if(state.view==='chart'&&!state.chart){bindBirthForm()}if(state.view==='ask')document.getElementById('sendAsk').onclick=sendAsk;if(state.view==='today'&&state.chart)document.getElementById('loadTransit').onclick=loadTransit}
async function tryDemo(){
  const payload={user_id:'demo-experience',birth:{date:'1985-03-14',time:'07:23',location:'Demo chart',timezone:'UTC'}};
  try{const r=await fetch('/v1/charts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const raw=await r.json();const fr=await fetch(`/v1/charts/${raw.id}/foundation`);state.chart=await fr.json();state.chat=[];state.transit=null;state.todayReading=null;try{localStorage.setItem('ky_chart_v1',JSON.stringify(state.chart))}catch{};go('chart')}catch(err){alert('Demo chart failed: '+err.message)}
}
let birthPlaceTimer=null;
function bindBirthForm(){
  const form=document.getElementById('birthForm'); if(!form)return;
  const location=document.getElementById('birthLocation');
  const results=document.getElementById('placeResults');
  const submit=document.getElementById('birthSubmit');
  let selected=null;
  const refresh=()=>{submit.disabled=!(selected && form.date.value && form.hour.value && form.minute.value && form.ampm.value);};
  location.addEventListener('input',()=>{
    selected=null; document.getElementById('birthTimezone').value=''; document.getElementById('birthLatitude').value=''; document.getElementById('birthLongitude').value='';
    refresh(); clearTimeout(birthPlaceTimer); const q=location.value.trim(); if(q.length<2){results.innerHTML='';return;}
    birthPlaceTimer=setTimeout(async()=>{try{const r=await fetch('/v1/birthplaces/search?q='+encodeURIComponent(q));const places=await r.json();results.innerHTML=places.map((p,i)=>`<button type="button" class="place-option" data-place="${i}"><strong>${esc(p.name)}</strong><small>${esc(p.display_name)}</small></button>`).join('');results._places=places;}catch{results.innerHTML='<div class="place-error">Birthplace search is temporarily unavailable.</div>'}},300);
  });
  results.addEventListener('click',async e=>{const b=e.target.closest('.place-option');if(!b)return;selected=results._places[Number(b.dataset.place)];location.value=selected.display_name;results.innerHTML='';
    try{const time=to24(form.hour.value,form.minute.value,form.ampm.value);const date=form.date.value;if(!date){return;}const r=await fetch(`/v1/birthplaces/timezone?latitude=${selected.latitude}&longitude=${selected.longitude}&date=${date}&time=${time}`);if(!r.ok)throw new Error(await r.text());const tz=await r.json();document.getElementById('birthTimezone').value=tz.timezone;document.getElementById('birthLatitude').value=selected.latitude;document.getElementById('birthLongitude').value=selected.longitude;document.getElementById('birthResolved').hidden=false;document.getElementById('birthResolved').textContent=`${selected.name} · ${tz.timezone} · UTC${tz.utc_offset_at_birth>=0?'+':''}${tz.utc_offset_at_birth}`;refresh();}catch{selected=null;document.getElementById('birthResolved').hidden=true;alert('I could not determine the historical timezone for that birthplace. Please choose another place or try again.');refresh();}
  });
  ['date','hour','minute','ampm'].forEach(n=>form[n].addEventListener('change',async()=>{if(selected){try{const time=to24(form.hour.value,form.minute.value,form.ampm.value);const r=await fetch('/v1/birthplaces/timezone?latitude='+selected.latitude+'&longitude='+selected.longitude+'&date='+form.date.value+'&time='+time);if(!r.ok)throw new Error();const tz=await r.json();document.getElementById('birthTimezone').value=tz.timezone;document.getElementById('birthResolved').textContent=selected.name+' · '+tz.timezone+' · UTC'+(tz.utc_offset_at_birth>=0?'+':'')+tz.utc_offset_at_birth;refresh();}catch{selected=null;refresh();}}}));
  form.onsubmit=createChart; refresh();
}
function to24(hour,minute,ampm){let h=Number(hour)%12;if(ampm==='PM')h+=12;return `${String(h).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;}
async function createChart(e){e.preventDefault();const f=new FormData(e.target);const time=to24(f.get('hour'),f.get('minute'),f.get('ampm'));const payload={user_id:'demo-user',birth:{date:f.get('date'),time,location:f.get('location'),timezone:f.get('timezone'),latitude:Number(f.get('latitude')),longitude:Number(f.get('longitude'))}};const btn=e.target.querySelector('#birthSubmit');btn.disabled=true;btn.textContent='Calculating…';try{const r=await fetch('/v1/charts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const raw=await r.json();const fr=await fetch(`/v1/charts/${raw.id}/foundation`);state.chart=await fr.json();try{localStorage.setItem('ky_chart_v1',JSON.stringify(state.chart))}catch{};go('chart')}catch(err){alert('Chart calculation failed: '+err.message)}finally{btn.textContent='Meet My Chart';btn.disabled=false}}
async function loadTransit(){
  const input=document.getElementById('transitAt'); if(!input||!state.chart)return;
  const local=new Date(input.value); const at=local.toISOString();
  const r=await fetch(`/v1/charts/${state.chart.chart_id}/today?at=${encodeURIComponent(at)}`);
  if(!r.ok){alert('Transit calculation failed: '+await r.text());return}
  const payload=await r.json(); state.transit=payload.transit; state.todayReading=payload; render();
}
function setTransitMoment(which){
  const base=new Date();
  if(which==='yesterday')base.setDate(base.getDate()-1);
  if(which==='tomorrow')base.setDate(base.getDate()+1);
  const input=document.getElementById('transitAt');
  if(!input)return;
  const tz=state.chart?.birth_data?.timezone||'UTC';
  try{
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(base);
    const o=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    input.value=`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`;
  }catch{input.value=base.toISOString().slice(0,16)}
  loadTransit();
}
function askAboutToday(){const input=document.getElementById('askInput');go('ask');setTimeout(()=>{const el=document.getElementById('askInput');if(el){el.value='Help me understand what today is bringing into my design';el.focus()}},50)}
function openGateFromToday(g){state.explore.kind='gate';state.explore.detail=null;go('explore');openGate(g)}
function askSuggestion(q){const input=document.getElementById('askInput');if(input){input.value=q;sendAsk()}}
async function sendAsk(){const input=document.getElementById('askInput');const q=input.value.trim();if(!q)return;if(!state.chart){state.chat.push({role:'ai',text:'We can start without a chart too. If you want this to become personal, create My Chart and I’ll have your actual design in front of me.'});render();return}state.chat.push({role:'user',text:q});input.value='';render();const r=await fetch(`/v1/charts/${state.chart.chart_id}/questions/context`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,at:state.transit?.timestamp_utc||null})});const ctx=await r.json();const core=ctx.chart||{};const type=(core.type||'').replaceAll('_',' '), authority=(core.authority||'').replaceAll('_',' '), profile=core.profile||'';let answer='';const lower=q.toLowerCase();if((lower.includes('today')||lower.includes('now')||lower.includes('transit'))&&state.todayReading?.reading){const rd=state.todayReading.reading;const first=rd.cards?.[0];answer=`For the moment you’re looking at, your natal design has not changed. The current transit is temporary.\n\n${rd.one_line}\n\n${first?first.title+': '+first.summary:''}\n\nThe useful next step is not to assume what this means for you, but to notice whether it matches anything you are actually experiencing. The reflection in the Today reading is Know Yourself synthesis, not a claim from the source.`}else if(lower.includes('gate 34')||lower.includes('gate34')||lower.includes('34-57')){const kd=await fetch('/v1/knowledge/gates/34').then(x=>x.json());const natal=(core.channels||[]).map(x=>x.channel);const isDefined=natal.some(x=>x==='34-57'||x==='10-34'||x==='20-34');answer=`Gate 34 is a real part of your chart${isDefined?' — it is defined through '+natal.filter(x=>x==='34-57'||x==='10-34'||x==='20-34').join(' and '):''}.\n\nThe Complete Rave I’Ching presents it as a gate of Sacral power: energy that is available for use, capable of fuelling three channels, and associated with independence and conviction. It also makes an important distinction: the power itself is not awareness.\n\nIts central keynote is: “${kd.keynote}”\n\nFor you, I would explore that less as “How powerful am I?” and more as “Where does energy arise naturally in me, and where do I start pushing when I don’t need to?” That is a Know Yourself reflection, not a claim from the source.`}else if(lower.includes('authority')){answer=`In your chart, your Authority is ${authority}.\n\nThat is more useful as something to experiment with than something you have to understand intellectually. We can look at how it shows up in actual decisions you are making right now.\n\nYour Type is ${type}, and your Profile is ${profile}. Those pieces belong together — so I’d rather explain your Authority in the context of your design than give you a generic definition.`}else if(lower.includes('channel')){const ch=(core.channels||[]).map(x=>x.channel).join(' · ')||'none';answer=`You have ${ch} defined in your natal design.\n\nThose are not just items on a checklist. They are consistent connections in your BodyGraph. Pick one that catches your attention and we can explore what the source material says, then bring it back to your life.`}else{answer=`Here is what I can say with confidence from your chart right now: you are a ${type} with ${authority} Authority and a ${profile} Profile.\n\nBut I don’t want to stop there. The interesting question is what you are actually trying to understand — a decision, a relationship, a pattern, a feeling, or simply why something keeps happening. Ask me that, and I’ll use your chart as context rather than giving you a generic Human Design answer.`}state.chat.push({role:'ai',text:answer});render()}
async function setExplore(k){state.explore.kind=k;state.explore.detail=null;state.explore.query='';if(k==='gate'&&!state.explore.catalog){const r=await fetch('/v1/knowledge/gates');state.explore.catalog=await r.json()}render()}
